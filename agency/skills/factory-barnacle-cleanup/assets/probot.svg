      <circle fill="url(#gold)" stroke="#050606" stroke-width="9" cx="515" cy="69" r="31"/>
      <circle fill="#fff5d5" cx="525" cy="58" r="8"/>
      <path fill="url(#gold)" stroke="#050606" stroke-width="9" stroke-linejoin="round" d="M470 179c28-18 73-18 101 0l7 42H463z"/>
    </g>

    <g id="head">
      <path fill="url(#teal)" stroke="#050606" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" d="M286 226c42-45 395-47 449-4 39 31 43 197 7 239-58 68-407 68-465 1-35-40-30-193 9-236z"/>
      <path fill="#064f55" stroke="#050606" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".72" d="M327 304c59-47 301-55 373-22 34 16 44 45 43 82-1 49-22 87-67 104-76 29-260 27-321-6-43-23-58-116-28-158z"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="10" cx="435" cy="351" r="60"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="10" cx="587" cy="351" r="60"/>
      <circle fill="#050606" cx="435" cy="351" r="27"/>
      <circle fill="#050606" cx="587" cy="351" r="27"/>
      <circle fill="#fff" cx="445" cy="337" r="10"/>
      <circle fill="#fff" cx="597" cy="337" r="10"/>
      <path fill="none" stroke="#f6d984" stroke-width="10" stroke-linecap="round" d="M472 428h84"/>
      <path fill="none" stroke="#050606" stroke-width="7" stroke-linecap="round" d="M358 428h22"/>
      <path fill="none" stroke="#fff5d5" stroke-width="8" stroke-linecap="round" d="M361 256h116"/>
    </g>

    <g id="ears">
      <rect fill="url(#gold)" stroke="#050606" stroke-width="9" x="246" y="328" width="44" height="78" rx="18"/>
      <rect fill="url(#gold)" stroke="#050606" stroke-width="9" x="734" y="328" width="44" height="78" rx="18"/>
    </g>

    <g id="neck-body">
      <path fill="#1f3030" stroke="#050606" stroke-width="9" stroke-linejoin="round" d="M459 499h105v44c-31 17-75 17-105 0z"/>
      <path fill="url(#teal)" stroke="#050606" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" d="M364 548c54-38 240-40 300-1 43 28 48 189 9 225-55 52-268 53-324 0-37-35-30-194 15-224z"/>
      <path fill="#07848d" opacity=".35" d="M388 574c36-31 106-43 181-36-103 42-155 110-158 205-43-37-50-139-23-169z"/>
      <g id="chest-o-ring">
        <!-- brand_messaging #48: the defining mark. Master geometry and fills, verbatim:
             gold r=66 + teal r=35 at (510,658), outline stroke 8 in the master's near-black. -->
        <circle fill="url(#gold)" stroke="#050606" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="510" cy="658" r="66"/>
        <circle fill="url(#teal)" stroke="#050606" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="510" cy="658" r="35"/>
      </g>
      <circle fill="#7fd0c9" cx="452" cy="589" r="6"/>
      <circle fill="#7fd0c9" cx="493" cy="579" r="6"/>
      <circle fill="#7fd0c9" cx="556" cy="584" r="6"/>
      <circle fill="#7fd0c9" cx="612" cy="614" r="6"/>
    </g>

    <g id="left-routing-arm">
      <path fill="url(#gold)" stroke="#050606" stroke-width="9" d="M358 571c-34 5-54 25-57 58 9 20 27 33 51 39l36-56z"/>
      <path fill="#1f3030" stroke="#050606" stroke-width="8" stroke-linejoin="round" d="M299 616l54 50-32 42-60-45z"/>
      <path fill="url(#teal)" stroke="#050606" stroke-width="9" stroke-linejoin="round" d="M248 648c31 9 59 27 81 55l-53 71c-42-9-73-35-88-75 12-24 32-40 60-51z"/>
      <g id="routing-puck" transform="translate(163 604)">
        <circle fill="url(#gold)" stroke="#050606" stroke-width="8" cx="55" cy="55" r="35"/>
        <circle fill="#07848d" stroke="#050606" stroke-width="7" cx="55" cy="55" r="17"/>
        <path fill="none" stroke="#ffc928" stroke-width="7" stroke-linecap="round" d="M25 16L6 0M55 5V-24M85 16l19-16M103 55h28M25 94L6 110"/>
      </g>
    </g>

    <g id="right-checklist-arm">
      <path fill="url(#gold)" stroke="#050606" stroke-width="9" d="M667 571c34 5 54 25 57 58-9 20-27 33-51 39l-36-56z"/>
      <path fill="#1f3030" stroke="#050606" stroke-width="8" stroke-linejoin="round" d="M726 616l-54 50 32 42 60-45z"/>
      <path fill="url(#teal)" stroke="#050606" stroke-width="9" stroke-linejoin="round" d="M777 648c-31 9-59 27-81 55l53 71c42-9 73-35 88-75-12-24-32-40-60-51z"/>
      <g id="checklist" transform="translate(737 532) rotate(26)">
        <rect fill="#e7dfc8" stroke="#050606" stroke-width="8" x="0" y="0" width="104" height="146" rx="10"/>
        <rect fill="url(#gold)" stroke="#050606" stroke-width="7" x="31" y="-16" width="43" height="29" rx="7"/>
        <path fill="none" stroke="#07848d" stroke-width="7" stroke-linecap="round" d="M21 43h52M21 71h47M21 99h54"/>
        <path fill="none" stroke="#d48b28" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M73 43l12 12 21-29M73 72l12 12 21-29"/>
      </g>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="7" cx="776" cy="787" r="19"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="7" cx="798" cy="807" r="19"/>
    </g>

    <g id="probot-role-badge" transform="translate(272 866) scale(0.64) translate(-512 -655)">
      <!-- #751 / brand_messaging #120: the role instrument that used to replace the O-ring,
           relocated here unchanged in shape. -->
      <circle fill="#123844" stroke="#050606" stroke-width="9" cx="512" cy="655" r="62"/>
        <circle fill="none" stroke="#7fd0c9" stroke-width="7" cx="512" cy="655" r="38"/>
        <path fill="none" stroke="#7fd0c9" stroke-width="7" stroke-linecap="round" d="M512 577v28M512 705v28M434 655h28M562 655h28M458 601l20 20M546 689l20 20M566 601l-20 20M478 689l-20 20"/>
        <text x="512" y="668" text-anchor="middle" font-family="Monaco, Menlo, Consolas, Courier New, monospace" font-size="39" font-weight="700" fill="#7fd0c9">FIT</text>
    </g>

    <g id="legs">
      <path fill="#1f3030" stroke="#050606" stroke-width="8" d="M431 775h59v47h-59zM535 775h59v47h-59z"/>
      <path fill="url(#gold)" stroke="#050606" stroke-width="8" d="M438 820h48v64h-48zM540 820h48v64h-48z"/>
      <path fill="url(#teal)" stroke="#050606" stroke-width="9" d="M404 880c56-22 101-2 120 52-57 18-133 16-181 0 10-23 30-41 61-52z"/>
      <path fill="url(#teal)" stroke="#050606" stroke-width="9" d="M620 880c-56-22-101-2-120 52 57 18 133 16 181 0-10-23-30-41-61-52z"/>
      <path fill="none" stroke="#fff5d5" stroke-width="7" stroke-linecap="round" d="M390 908c18-9 35-12 50-10"/>
      <path fill="none" stroke="#fff5d5" stroke-width="7" stroke-linecap="round" d="M584 900c18 2 34 8 48 18"/>
    </g>
  </g>
</svg>
