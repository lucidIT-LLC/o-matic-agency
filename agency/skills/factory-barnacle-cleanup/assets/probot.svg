<svg viewBox="37 33 932 932" version="1.1" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Probot O-Matic Robot Vector</title>
  <desc id="desc">Affinity-safe roster vector of Probot, O-Matic orchestrator, using the new robot model without legacy badge or ribbon framing. Task #751 (2026-09-28, Monet): chest O-ring restored from the registered master brand/omatic-robot-vector-no-bg.svg (sha256 837fbc0156a023ec) at its own geometry, gold r66 + teal r35 at 510,658; palette rebound to the master's gradients per decision #522; the role instrument moved off the chest per brand_messaging #120; no red on the robot (color.alert).</desc>
  <defs>
    <radialGradient id="teal" cx="28%" cy="18%" r="88%">
      <stop offset="0" stop-color="#0aa1aa"/>
      <stop offset="0.55" stop-color="#087f88"/>
      <stop offset="1" stop-color="#045c64"/>
    </radialGradient>
    <radialGradient id="darkTeal" cx="30%" cy="20%" r="86%">
      <stop offset="0" stop-color="#064f55"/>
      <stop offset="1" stop-color="#064f55"/>
    </radialGradient>
    <radialGradient id="gold" cx="30%" cy="20%" r="82%">
      <stop offset="0" stop-color="#ffe477"/>
      <stop offset="0.52" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#e4a900"/>
    </radialGradient>
    <radialGradient id="cream" cx="30%" cy="20%" r="86%">
      <stop offset="0" stop-color="#fff2cb"/>
      <stop offset="1" stop-color="#fff2cb"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="none"/>
  <ellipse fill="#e8ddc7" cx="518" cy="930" rx="276" ry="28" opacity=".42"/>

  <g id="probot-roster" transform="translate(0 8)">
