name: verify-pack

# CANONICAL SOURCE: o-matic-studio/.github/workflows/verify-pack.yml. Copied
# byte-for-byte into o-matic-firm and o-matic-agency by
# scripts/sync-pack-tooling.mjs; every step discovers the plugin directory
# rather than naming it, so one file serves all three packs.
#
# Task #659: the four marketplace repos had no CI. Task #1002: the Spirit Gate
# step that followed could never pass here -- it needed a token for, and a route
# into, a tailnet-only server. CI now checks what it can check deterministically
# and offline; the live Spirit Gate (scripts/spirit-gate-check.mjs) is the local
# pre-release step, run where the server is reachable. Smith #1013 F11: the
# drift and path checks that existed but never ran in CI are wired below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify pack integrity
        run: node scripts/verify-pack.mjs .
      - name: Persona identity matches the committed attestation (offline, task #1002)
        run: node scripts/verify-identity-attestation.mjs .
      - name: Per-plugin checks (paths, Copilot payload drift, adapter deploy fixtures)
        run: |
          set -e
          for manifest in */.claude-plugin/plugin.json; do
            plugin="$(dirname "$(dirname "$manifest")")"
            echo "== $plugin"
            node "$plugin/scripts/check-paths.mjs"
            node "$plugin/scripts/sync-copilot-payload.mjs" --check
          done
      - name: Host adapters are current, and skills meet the vendor rules (task #1024)
        run: |
          set -e
          node scripts/test-build-host-adapters.mjs
          node scripts/build-host-adapters.mjs . --check
      - name: Microsoft 365 Copilot packages (schemas, icons, zip)
        run: |
          set -e
          npm install --prefix /tmp/m365-ajv ajv@8.17.1 ajv-draft-04@1.0.0 pngjs@7.0.0
          NODE_PATH=/tmp/m365-ajv/node_modules node scripts/verify-m365.mjs .
          node scripts/build-m365-packages.mjs . --check
      - name: Hook fixture suites
        run: |
          set -e
          found=0
          for suite in */hooks/*_fixtures.py; do
            [ -e "$suite" ] || continue
            found=1
            echo "== $suite"
            python3 "$suite"
          done
          [ "$found" = 1 ] || echo "no hook fixture suites in this pack"
      - name: Skill shape and size
        run: node scripts/check-skills.mjs
      - name: Version bump on content change
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs --base "origin/${{ github.base_ref }}"
      - name: Public-readiness gate
        run: |
          python3 -m unittest discover -s scripts/public-gate/tests
          python3 scripts/public-gate/check-public-package.py --profile skills-pack \
            --denylist .github/public-gate/denylist.tsv --allowlist .github/public-gate/allowlist.tsv \
            --hashed .github/public-gate/hashed-terms.json .
      - name: Conformance (fixture mode, offline)
        if: hashFiles('*/evals/run-conformance.mjs') != ''
        run: cd "$(dirname "$(ls */evals/run-conformance.mjs | head -1)")" && npm ci && node run-conformance.mjs
